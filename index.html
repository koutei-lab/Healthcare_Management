<body class="text-slate-800 antialiased min-h-screen flex flex-col selection:bg-emerald-100 selection:text-emerald-900 pb-16">

  <!-- ヘッダー（スマホ最適化） -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
    <div class="max-w-xl mx-auto px-3.5 py-2.5 flex items-center justify-between gap-2">
      <!-- 左：アイコン ＆ タイトル -->
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center flex-shrink-0 shadow-sm shadow-emerald-600/30">
          <i data-lucide="file-text" class="w-4 h-4 stroke-[2.2]"></i>
        </div>
        <h1 class="font-extrabold text-slate-900 text-base sm:text-lg tracking-tight whitespace-nowrap">
          医療経営士2級
        </h1>
      </div>

      <!-- 右：明朝7時タイマー・新問5ボタン・設定 -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <!-- 7時リセットカウントダウン -->
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-100 border border-slate-200/80 text-[11px] font-mono font-semibold text-slate-600" title="明朝7:00のリセットまでの残り時間">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="countdownTimer">--:--:--</span>
        </div>

        <!-- 新問5ボタン（完全新規5問の抽出 & AI自動補充） -->
        <button id="drawNewFiveBtn" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold transition shadow-sm active:scale-95" title="過去に見たことがない完全新規の5問を出題">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5" id="drawBtnIcon"></i>
          <span>新問5</span>
        </button>

        <!-- 管理・設定モーダルボタン -->
        <button id="openSettingsBtn" class="p-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-500 transition active:scale-95" title="学習履歴と設定">
          <i data-lucide="clock" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="mainContentArea" class="flex-grow max-w-xl mx-auto w-full px-3.5 py-4 space-y-3.5">

    <!-- 注意事項バナー（スター復習キープのガイド） -->
    <div class="bg-amber-50/60 border border-amber-200/90 rounded-2xl p-3 sm:p-3.5 shadow-xs flex items-start gap-2.5 text-xs text-amber-900">
      <i data-lucide="star" class="w-4 h-4 text-amber-500 fill-amber-400 flex-shrink-0 mt-0.5"></i>
      <div class="leading-relaxed">
        <p class="font-medium">
          理解できたものはそのまま、再復習したい重要論点には<strong class="font-bold text-amber-700">「★スター」</strong>をつけてください。
          <span class="text-amber-800/80 text-[11px] block mt-0.5">（※スターのない論点は明朝7時に出題プールへ自動整理されます）</span>
        </p>
      </div>
    </div>

    <!-- モード切り替えタブ ＆ ステータス -->
    <div class="flex items-center justify-between gap-2 bg-slate-100/90 p-1.5 rounded-xl border border-slate-200 text-xs">
      <div class="flex items-center gap-1" id="tabContainer">
        <button data-tab="active" class="mode-tab px-3 py-1 rounded-lg font-semibold bg-white text-slate-900 shadow-xs border border-slate-200">
          本日の出題 (<span id="activeCountBadge">5</span>)
        </button>
        <button data-tab="starred" class="mode-tab px-3 py-1 rounded-lg font-medium text-slate-600 hover:text-slate-900 flex items-center gap-1">
          <i data-lucide="star" class="w-3 h-3 text-amber-500 fill-amber-400"></i>
          <span>復習キープ (<span id="starredCountBadge">0</span>)</span>
        </button>
      </div>

      <div class="text-[11px] text-slate-500 pr-1 flex items-center gap-1.5">
        <span id="poolStatsText">ストック: 30問</span>
      </div>
    </div>

    <!-- AI生成中のローディングバナー -->
    <div id="aiGeneratingBanner" class="hidden bg-emerald-50 border border-emerald-200 rounded-2xl p-3 text-center space-y-1.5 shadow-xs">
      <div class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-600 text-white animate-spin">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
      </div>
      <p class="text-xs font-bold text-emerald-900">医療経営士2級の完全未出論点をAI生成中...</p>
      <p class="text-[11px] text-emerald-700">過去に出題された論点を完全除外し、最新の制度・財務論点を構築しています</p>
    </div>

    <!-- カード一覧コンテナ -->
    <div id="cardsList" class="space-y-3.5">
      <!-- カードが動的に展開されます -->
    </div>

    <!-- 0件状態 -->
    <div id="emptyState" class="hidden text-center py-12 px-4 bg-white rounded-2xl border border-dashed border-slate-300">
      <i data-lucide="check-circle-2" class="w-10 h-10 text-emerald-500 mx-auto mb-2 opacity-80"></i>
      <h3 class="font-bold text-slate-800 text-sm">表示する論点はありません</h3>
      <p class="text-xs text-slate-500 mt-1" id="emptyStateMsg">「新問5」ボタンを押して新しい未読問題を取得してください。</p>
      <button id="emptyStateBtn" class="mt-3 px-4 py-2 bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm">
        新問5を出題する
      </button>
    </div>

  </main>

  <!-- 設定・学習履歴モーダル -->
  <div id="settingsModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-200">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="font-bold text-slate-900 text-sm flex items-center gap-1.5">
          <i data-lucide="sliders" class="w-4 h-4 text-emerald-600"></i>
          学習設定と進捗
        </h3>
        <button id="closeSettingsModal" class="p-1 rounded-lg text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="py-3.5 space-y-3 text-xs">
        <div class="p-3 bg-slate-50 rounded-xl space-y-1.5 border border-slate-200/80">
          <div class="flex justify-between text-slate-600">
            <span>累計出題済み論点:</span>
            <span id="historySeenCount" class="font-bold text-slate-900">0問</span>
          </div>
          <div class="flex justify-between text-slate-600">
            <span>★復習キープ中:</span>
            <span id="historyStarredCount" class="font-bold text-amber-600">0問</span>
          </div>
          <div class="flex justify-between text-slate-600">
            <span>AI自動拡張プール:</span>
            <span id="historyAiCount" class="font-bold text-emerald-600">0問</span>
          </div>
        </div>

        <div>
          <label class="block text-slate-700 font-bold mb-1">文字サイズ</label>
          <div class="grid grid-cols-3 gap-1.5">
            <button data-size="sm" class="size-btn p-2 rounded-lg border border-slate-200 text-center text-xs font-semibold">小</button>
            <button data-size="md" class="size-btn p-2 rounded-lg border-2 border-emerald-600 bg-emerald-50 text-center text-xs font-bold text-emerald-900">標準</button>
            <button data-size="lg" class="size-btn p-2 rounded-lg border border-slate-200 text-center text-xs font-semibold">大</button>
          </div>
        </div>

        <div class="pt-2 border-t border-slate-100 flex flex-col gap-2">
          <button id="clearHistoryBtn" class="w-full py-2 bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 rounded-xl font-medium transition text-xs flex items-center justify-center gap-1">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            出題履歴をリセットして全問初期化
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 text-xs whitespace-nowrap">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400" id="toastIcon"></i>
    <span id="toastMsg">通知メッセージ</span>
  </div>

    const STORAGE_KEY = "med_mgr_2nd_app_v2";

    // アプリの状態管理
    let state = {
      activeCardIds: [],    // 現在「本日の出題」に表示されている5問のID
      seenCardIds: [],      // 過去に出題された全ID（新問5選出時に絶対除外）
      starredCardIds: [],   // ★復習キープ中のID
      readCardIds: [],      // 既読にしたID
      aiGeneratedPool: [],  // AIで生成された追加プール
      fontSize: "md",       // sm, md, lg
      currentTab: "active"  // 'active' または 'starred'
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        }
      } catch (e) {
        console.warn("Storage load error:", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("Storage save error:", e);
      }
    }

    // 全ナレッジプールの取得
    function getAllPool() {
      return [...INITIAL_KNOWLEDGE_POOL, ...state.aiGeneratedPool];
    }

    // 明朝7:00までのカウントダウンタイマー
    function updateCountdown() {
      const now = new Date();
      const target = new Date();
      // もし現在時刻が朝7時を過ぎていれば翌日の朝7時、まだなら当日の朝7時
      if (now.getHours() >= 7) {
        target.setDate(target.getDate() + 1);
      }
      target.setHours(7, 0, 0, 0);

      const diff = target - now;
      if (diff <= 0) {
        document.getElementById("countdownTimer").textContent = "00:00:00";
        return;
      }

      const h = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
      const m = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
      const s = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
      document.getElementById("countdownTimer").textContent = `${h}:${m}:${s}`;
    }

    // テキストから安全にJSON配列を抽出する関数
    function safeExtractJsonArray(text) {
      if (!text || typeof text !== 'string') return null;
      const codeMatch = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
      if (codeMatch && codeMatch[1]) {
        try {
          const res = JSON.parse(codeMatch[1].trim());
          if (Array.isArray(res) && res.length > 0) return res;
        } catch (e) {}
      }
      const first = text.indexOf('[');
      const last = text.lastIndexOf(']');
      if (first !== -1 && last !== -1 && last > first) {
        try {
          const res = JSON.parse(text.substring(first, last + 1));
          if (Array.isArray(res) && res.length > 0) return res;
        } catch (e) {}
      }
      try {
        const res = JSON.parse(text.trim());
        if (Array.isArray(res) && res.length > 0) return res;
      } catch (e) {}
      return null;
    }

    // AI（Gemini）による未出論点の自動補充
    async function fetchAiNewQuestions(neededCount = 5) {
      const allPool = getAllPool();
      const forbiddenTitles = allPool.map(q => q.title).slice(-25);

      const prompt = `あなたは「医療経営士2級」資格試験の公式シラバスおよび病院経営実務に精通した主任研究員です。
中堅管理職・事務長クラスが習得すべき、極めて実践的で出題頻度の高い【未出の重要論点】を${neededCount}問作成してください。

【重複厳禁（以下の論点と重複しないこと）】
${forbiddenTitles.join(" / ")}

【分野の例】
・病院財務・管理会計（ROI、キャッシュフロー、損益分岐点）
・診療報酬・DPC/PDPS（機能評価係数、重症度・医療看護必要度）
・医療法・医療政策（地域医療構想、かかりつけ医機能、医療法人制度）
・人事・労務（医師の働き方改革、評価制度、タスクシフト）
・医療情報・DX（HL7 FHIR、セキュリティガイドライン、オンライン資格確認）
・医療材料・物品（SPD、共同購入、特定保険医療材料）

【出力フォーマット】JSON配列のみを出力してください。
[
  {
    "category": "分野名（例: 病院財務・管理会計）",
    "title": "論点タイトル（例: 設備投資における正味現在価値法（NPV）と回収期間法）",
    "summary": "1〜2文の明快な概要文",
    "detail": "背景や制度・経営上の詳細な解説",
    "keyPoint": "【経営実務ポイント】具体的な数値基準や管理指標",
    "examTip": "【試験対策】医療経営士2級での引っかけポイントや頻出論点"
  }
]`;

      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const res = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: { parts: [{ text: "医療経営士2級の公式シラバスに準拠した厳格なJSON配列のみを出力してください。" }] }
        })
      });

      if (!res.ok) throw new Error("AI fetch failed");
      const data = await res.json();
      const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      const items = safeExtractJsonArray(rawText);
      if (!items || items.length === 0) throw new Error("JSON parse failed");

      return items.map((it, idx) => ({
        ...it,
        id: `ai_q_${Date.now()}_${idx}_${Math.random().toString(36).substr(2, 4)}`,
        isAiGenerated: true
      }));
    }

    // 【重要】完全新規「新問5」の出題エンジン
    // 過去に出題されたID（state.seenCardIds）を100%除外する
    async function drawCompletelyNewFive() {
      const drawBtn = document.getElementById("drawNewFiveBtn");
      const btnIcon = document.getElementById("drawBtnIcon");
      const banner = document.getElementById("aiGeneratingBanner");

      drawBtn.disabled = true;
      drawBtn.classList.add("opacity-60", "pointer-events-none");
      btnIcon.classList.add("animate-spin");

      // 過去に出題されたことがない（seenCardIdsに含まれない）カードのみを抽出
      const allPool = getAllPool();
      let availableUnseen = allPool.filter(c => !state.seenCardIds.includes(c.id));

      // もし未出ストックが5問未満なら、AIで新しい論点を即座に自動生成して補充！
      if (availableUnseen.length < 5) {
        banner.classList.remove("hidden");
        try {
          const needed = 5 - availableUnseen.length + 3; // 少し余裕を持って生成
          const generated = await fetchAiNewQuestions(needed);
          state.aiGeneratedPool.push(...generated);
          saveState();
          // プールを再取得
          availableUnseen = getAllPool().filter(c => !state.seenCardIds.includes(c.id));
        } catch (err) {
          console.warn("AI generation fallback:", err);
          // 万一AIが一時的にエラーでも、過去問の最古のものから再循環させて詰まりを回避
          if (availableUnseen.length === 0) {
            state.seenCardIds = state.starredCardIds.slice(); // スター付き以外をリセット
            availableUnseen = getAllPool().filter(c => !state.seenCardIds.includes(c.id));
          }
        } finally {
          banner.classList.add("hidden");
        }
      }

      // 未出問題から先頭5問を選出
      const selectedFive = availableUnseen.slice(0, 5);

      if (selectedFive.length > 0) {
        state.activeCardIds = selectedFive.map(c => c.id);
        
        // 選出された5問を出題済み履歴（seenCardIds）に追加して、次回以降絶対に再出題されないように記録！
        selectedFive.forEach(c => {
          if (!state.seenCardIds.includes(c.id)) {
            state.seenCardIds.push(c.id);
          }
        });

        // モードを「本日の出題」に自動切替
        state.currentTab = "active";
        updateTabUI();
        saveState();
        renderCards();
        showToast("✨ 完全新規の未読5問を出題しました！");
      }

      drawBtn.disabled = false;
      drawBtn.classList.remove("opacity-60", "pointer-events-none");
      btnIcon.classList.remove("animate-spin");
    }

    // 初回起動時の初期化（5問セット）
    function ensureInitialQuestions() {
      if (state.activeCardIds.length === 0) {
        // まだ何も出題されていない場合
        const all = getAllPool();
        const firstFive = all.slice(0, 5);
        state.activeCardIds = firstFive.map(c => c.id);
        firstFive.forEach(c => {
          if (!state.seenCardIds.includes(c.id)) {
            state.seenCardIds.push(c.id);
          }
        });
        saveState();
      }
    }

    // カードの描画
    function renderCards() {
      const container = document.getElementById("cardsList");
      const emptyState = document.getElementById("emptyState");
      const emptyStateMsg = document.getElementById("emptyStateMsg");
      const allPool = getAllPool();

      container.innerHTML = "";

      let targetCardIds = [];
      if (state.currentTab === "active") {
        targetCardIds = state.activeCardIds;
      } else {
        targetCardIds = state.starredCardIds;
      }

      // カード実体を取得
      const cardsToDisplay = targetCardIds.map(id => allPool.find(q => q.id === id)).filter(Boolean);

      // バッジ数の更新
      document.getElementById("activeCountBadge").textContent = state.activeCardIds.length;
      document.getElementById("starredCountBadge").textContent = state.starredCardIds.length;
      
      const unconsumedStock = allPool.filter(q => !state.seenCardIds.includes(q.id)).length;
      document.getElementById("poolStatsText").textContent = `未出ストック: ${unconsumedStock}問`;

      if (cardsToDisplay.length === 0) {
        emptyState.classList.remove("hidden");
        if (state.currentTab === "starred") {
          emptyStateMsg.textContent = "復習キープ（★）された論点はまだありません。重要論点の★を押して保存できます。";
          document.getElementById("emptyStateBtn").classList.add("hidden");
        } else {
          emptyStateMsg.textContent = "「新問5」ボタンを押して新しい未読問題を取得してください。";
          document.getElementById("emptyStateBtn").classList.remove("hidden");
        }
        return;
      }

      emptyState.classList.add("hidden");

      cardsToDisplay.forEach((item, index) => {
        const isRead = state.readCardIds.includes(item.id);
        const isStarred = state.starredCardIds.includes(item.id);

        const card = document.createElement("article");
        // スターがついている場合は琥珀色の枠線、それ以外は通常枠線
        card.className = `bg-white rounded-2xl border transition-all duration-200 shadow-xs p-4 sm:p-5 space-y-3 ${
          isStarred 
            ? 'border-amber-300 ring-1 ring-amber-200 shadow-amber-500/5' 
            : 'border-slate-200 hover:border-slate-300'
        }`;

        card.innerHTML = `
          <!-- 上部ヘッダー：番号・カテゴリ・状態・アクション -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[11px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md font-mono">
                #${index + 1}
              </span>
              <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200/80 font-semibold whitespace-nowrap">
                ${item.category}
              </span>
              <span class="text-[10px] px-2 py-0.5 rounded-md font-medium ${isRead ? 'bg-slate-100 text-slate-500' : 'bg-blue-50 text-blue-700 border border-blue-200'}">
                ${isRead ? '既読' : '未読'}
              </span>
              ${isStarred ? `
                <span class="text-[10px] px-2 py-0.5 rounded-md bg-amber-50 text-amber-800 border border-amber-200 font-bold flex items-center gap-0.5">
                  <i data-lucide="star" class="w-3 h-3 text-amber-500 fill-amber-400"></i>
                  ★復習キープ中
                </span>
              ` : ''}
              ${item.isAiGenerated ? `
                <span class="text-[9px] px-1.5 py-0.2 rounded bg-purple-50 text-purple-700 border border-purple-200 font-bold">AI新論点</span>
              ` : ''}
            </div>

            <!-- アクションボタン群（コピー・既読チェック・スター） -->
            <div class="flex items-center gap-1 text-slate-400">
              <button onclick="copyCardContent('${item.id}')" class="p-1.5 rounded-lg hover:bg-slate-100 hover:text-slate-700 transition" title="内容をコピー">
                <i data-lucide="copy" class="w-4 h-4"></i>
              </button>
              <button onclick="toggleRead('${item.id}')" class="p-1.5 rounded-lg hover:bg-slate-100 transition ${isRead ? 'text-emerald-600 bg-emerald-50' : 'hover:text-slate-700'}" title="${isRead ? '未読に戻す' : '既読にする'}">
                <i data-lucide="check" class="w-4 h-4 stroke-[2.5]"></i>
              </button>
              <button onclick="toggleStar('${item.id}')" class="p-1.5 rounded-lg hover:bg-amber-50 transition ${isStarred ? 'text-amber-500' : 'hover:text-amber-400'}" title="${isStarred ? '復習キープ解除' : '★復習キープに追加'}">
                <i data-lucide="star" class="w-4 h-4 ${isStarred ? 'fill-amber-400 text-amber-500' : ''}"></i>
              </button>
            </div>
          </div>

          <!-- タイトル ＆ 概要 -->
          <div>
            <h2 class="font-bold text-slate-900 text-base leading-snug tracking-tight">
              ${item.title}
            </h2>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mt-2 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              ${item.summary}
            </p>
          </div>

          <!-- 詳細アコーディオン（解説と要点を見る） -->
          <div id="detailBox_${item.id}" class="hidden pt-2 border-t border-slate-100 space-y-2.5 text-xs text-slate-700 leading-relaxed">
            <div>
              <span class="font-bold text-slate-800 block mb-1">【詳細解説】</span>
              <p>${item.detail}</p>
            </div>
            
            <div class="p-3 bg-emerald-50/70 rounded-xl border border-emerald-100 text-emerald-950">
              <span class="font-bold text-emerald-800 block mb-1">【経営管理・実務ポイント】</span>
              <p>${item.keyPoint}</p>
            </div>

            <div class="p-3 bg-amber-50/70 rounded-xl border border-amber-100 text-amber-950">
              <span class="font-bold text-amber-800 block mb-1">【医療経営士2級 試験対策チェック】</span>
              <p>${item.examTip}</p>
            </div>
          </div>

          <!-- 下部フッター：既読トグルボタン ＆ 解説展開ボタン -->
          <div class="flex items-center justify-between pt-1 border-t border-slate-100/80 text-xs">
            <button onclick="toggleRead('${item.id}')" class="flex items-center gap-1.5 font-medium transition ${isRead ? 'text-emerald-700' : 'text-slate-500 hover:text-slate-800'}">
              <i data-lucide="${isRead ? 'check-circle-2' : 'check'}" class="w-4 h-4 ${isRead ? 'text-emerald-600' : 'text-slate-400'}"></i>
              <span>${isRead ? '既読済み' : '未読（既読にする）'}</span>
            </button>

            <button onclick="toggleDetail('${item.id}')" id="toggleDetailBtn_${item.id}" class="flex items-center gap-1 text-emerald-700 hover:text-emerald-900 font-semibold group py-1">
              <span>解説と要点を見る</span>
              <i data-lucide="chevron-right" class="w-4 h-4 transition-transform group-hover:translate-x-0.5" id="chevron_${item.id}"></i>
            </button>
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // 解説のアコーディオン展開/格納
    function toggleDetail(id) {
      const box = document.getElementById(`detailBox_${id}`);
      const btn = document.getElementById(`toggleDetailBtn_${id}`);
      const chevron = document.getElementById(`chevron_${id}`);
      if (!box) return;

      const isHidden = box.classList.contains("hidden");
      if (isHidden) {
        box.classList.remove("hidden");
        btn.querySelector("span").textContent = "閉じる";
        chevron.classList.add("rotate-90");
      } else {
        box.classList.add("hidden");
        btn.querySelector("span").textContent = "解説と要点を見る";
        chevron.classList.remove("rotate-90");
      }
    }

    // 既読の切り替え
    function toggleRead(id) {
      if (state.readCardIds.includes(id)) {
        state.readCardIds = state.readCardIds.filter(i => i !== id);
        showToast("「未読」に戻しました");
      } else {
        state.readCardIds.push(id);
        showToast("「既読」にしました");
      }
      saveState();
      renderCards();
    }

    // スター（★復習キープ）の切り替え
    function toggleStar(id) {
      if (state.starredCardIds.includes(id)) {
        state.starredCardIds = state.starredCardIds.filter(i => i !== id);
        showToast("復習キープを解除しました");
      } else {
        state.starredCardIds.push(id);
        showToast("★ 復習キープに登録しました！");
      }
      saveState();
      renderCards();
    }

    // 内容をクリップボードにコピー
    function copyCardContent(id) {
      const item = getAllPool().find(q => q.id === id);
      if (!item) return;

      const text = `【医療経営士2級】${item.title}\n\n■ 要約:\n${item.summary}\n\n■ 詳細解説:\n${item.detail}\n\n■ 経営実務ポイント:\n${item.keyPoint}\n\n■ 試験対策:\n${item.examTip}`;
      
      const textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      document.body.removeChild(textarea);

      showToast("論点の内容をコピーしました");
    }

    // トースト通知
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.textContent = msg;

      toast.classList.remove("opacity-0", "translate-y-10", "pointer-events-none");
      toast.classList.add("opacity-100", "translate-y-0");

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-10", "pointer-events-none");
      }, 2200);
    }

    // タブ切り替え
    function updateTabUI() {
      document.querySelectorAll(".mode-tab").forEach(tab => {
        const t = tab.getAttribute("data-tab");
        if (t === state.currentTab) {
          tab.className = "mode-tab px-3 py-1 rounded-lg font-semibold bg-white text-slate-900 shadow-xs border border-slate-200";
        } else {
          tab.className = "mode-tab px-3 py-1 rounded-lg font-medium text-slate-600 hover:text-slate-900";
        }
      });
    }

    // フォントサイズ適用
    const FONT_MAP = {
      sm: '0.875rem',
      md: '1rem',
      lg: '1.15rem'
    };
    function applyFontSize(size) {
      state.fontSize = size;
      document.documentElement.style.setProperty('--app-font-scale', FONT_MAP[size] || '1rem');
      document.querySelectorAll(".size-btn").forEach(btn => {
        if (btn.getAttribute("data-size") === size) {
          btn.className = "size-btn p-2 rounded-lg border-2 border-emerald-600 bg-emerald-50 text-center text-xs font-bold text-emerald-900";
        } else {
          btn.className = "size-btn p-2 rounded-lg border border-slate-200 text-center text-xs font-semibold";
        }
      });
      saveState();
    }

    // 初期化とイベントリスナー設定
    document.addEventListener("DOMContentLoaded", () => {
      loadState();
      applyFontSize(state.fontSize || "md");
      ensureInitialQuestions();
      renderCards();

      // タイマー開始
      updateCountdown();
      setInterval(updateCountdown, 1000);

      // 「新問5」ボタンクリック
      document.getElementById("drawNewFiveBtn").addEventListener("click", () => {
        drawCompletelyNewFive();
      });

      // 0件時ボタン
      document.getElementById("emptyStateBtn").addEventListener("click", () => {
        drawCompletelyNewFive();
      });

      // タブ切り替え
      document.querySelectorAll(".mode-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          state.currentTab = tab.getAttribute("data-tab");
          updateTabUI();
          renderCards();
        });
      });

      // 設定モーダル
      const settingsModal = document.getElementById("settingsModal");
      document.getElementById("openSettingsBtn").addEventListener("click", () => {
        document.getElementById("historySeenCount").textContent = `${state.seenCardIds.length}問`;
        document.getElementById("historyStarredCount").textContent = `${state.starredCardIds.length}問`;
        document.getElementById("historyAiCount").textContent = `${state.aiGeneratedPool.length}問`;

        settingsModal.classList.remove("hidden");
        setTimeout(() => {
          settingsModal.classList.remove("opacity-0");
        }, 10);
      });

      document.getElementById("closeSettingsModal").addEventListener("click", () => {
        settingsModal.classList.add("opacity-0");
        setTimeout(() => {
          settingsModal.classList.add("hidden");
        }, 200);
      });

      // 文字サイズ変更ボタン
      document.querySelectorAll(".size-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          applyFontSize(btn.getAttribute("data-size"));
        });
      });

      // 履歴全リセットボタン
      document.getElementById("clearHistoryBtn").addEventListener("click", () => {
        state.seenCardIds = [];
        state.readCardIds = [];
        state.starredCardIds = [];
        state.activeCardIds = [];
        ensureInitialQuestions();
        saveState();
        renderCards();
        settingsModal.classList.add("opacity-0");
        setTimeout(() => settingsModal.classList.add("hidden"), 200);
        showToast("出題履歴をリセットし、初期状態に戻しました");
      });
    });
  </script>
</body>
</html>
